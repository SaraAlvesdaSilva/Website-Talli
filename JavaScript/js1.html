<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        function darkmode() {
            document.querySelector("body")
                .classList
                .toggle('darkmode');
        }
    </script>
    <script>
        function popup() {
            const mydiv = document.getElementById("modalwindow")
                mydiv.classList
                .toggle("on")
        
        function closePopup(){
            const mydiv = document.getElementById("modalwindow")
            mydiv.classList
            .toggle("on")
        }
        }
    </script>
    <link rel="stylesheet" href="js1.css">
</head> 
<body class ="darkmode">
    <button type="button"onclick="darkmode()">Darkmode</button>
    <p>Lorem ipsum dolor sit amet...</p>
    <button type="button" onclick="popup()">Klick mich!</button>
    <div id="modalwindow" class="off">Lorem ipsum dolor sit
        <button type="button" onclick="closePopup()">Schließen</button>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      function getIt () {

        const url = "https://date.nager.at/api/v3/PublicHolidays/2024/AT"
        const method = "GET"

        const request = new XMLHttpRequest()

        request.open(method, url)
        request.send()

        request.onreadystatechange = function () {
          if (this.readyState == 4 && this.status == 200) {
            const responseText = this.response
            const responseAsObject = JSON.parse(responseText)
            const nagerdate = (responseAsObject)
            document.getElementById('ergebnis').innerText = nagerdate[0].localName
          }
        }

      }
    </script>
  </head>

  <body>
    <button type="button" onclick="getIt()">Get It!</button>

    <div id="ergebnis"></div>
    
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Talli - Books</title>
    <meta name="description" content="Tauche ein in spannende, neue Welten un. Erlebe mitreißende Geschichten, atemberaubende Designs, faszinierende Kreaturen und Avatare, die euch ganz neue Horizonte eröffnen!">
    <link rel="stylesheet" href="main2.css">
    <script>
      console.log('script has been read')

      function convertToDollar() {
        const priceEuro = document.getElementById('euro').value

        const priceDollar = priceEuro * 1.0867

        document.getElementById('Dollar').innerText = priceDollar
      }

    </script>
  </head>

  <body class="body">
    <div class="kopfzeile">
      <a href="index.html">
      <button class="return">
        <img class="logo1" src="./Image/return button.png" alt="Zurück">
      </button>
      </a>
      <img class="profile-picture" src="./Image/channels4_profile.jpg">
    </div>
    <div class="alltext">
      <h1>My collection of short stories</h1>
      <h2>My book projects</h2>
      <p class="waehrungsrechner">Währungsrechner Euro-Dollar</p>
      <input id="euro" type="number">
      <button type="button" onclick="convertToDollar()">In Dollar konvertieren</button>
      <div id="Dollar"></div>
    </div>
  </body>
</html>
